name: autonomous-delivery
description: |
  Implement a requested task in an isolated branch, validate it, open a pull
  request, address model-review and CI findings, and enable automatic squash merge
  after the model reviewer reports no open finding on the current commit and
  required checks pass.
  Use for GitHub issues and feature or repair requests that should be delivered
  without a human PR review. Routine review and merge need no approval gate.

provider: opencode
model: openai/gpt-6.1-sol
requires: [github]
worktree:
  enabled: true
inputs:
  issue: { required: false }
returns: review

nodes:
  - id: status-start
    script: delivery-status
    runtime: bun
    timeout: 130000

  - id: implement
    command: implement-and-publish
    model: '@implementer'
    depends_on: [status-start]
    trigger_rule: all_done
    context: fresh
    output_type: implementation

  - id: resolve
    script: read-published-pr
    runtime: bun
    depends_on: [implement]
    output_type: pull-request
    output_format:
      type: object
      properties:
        number: { type: integer, minimum: 1 }
        url: { type: string }
        branch: { type: string }
      required: [number, url, branch]

  - id: review
    include: autonomous-review
    depends_on: [resolve]
    with:
      number: "$resolve.output.number"
      branch: "$resolve.output.branch"

  - id: status-finalize
    script: delivery-status
    runtime: bun
    timeout: 130000
    depends_on: [status-start, implement, resolve, review]
    trigger_rule: all_done
