name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Factory CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.0'
      - run: mkdir -p .archon/runtime
      - run: npm run validate
      - name: Runtime tests under a foreign ARCHON_REPO_ROOT
        run: ARCHON_REPO_ROOT="$(mktemp -d)" python3 scripts/test_archon_runtime.py
