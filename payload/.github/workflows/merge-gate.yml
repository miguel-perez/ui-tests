name: Merge gate

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
  workflow_run:
    workflows: [CI, PR review event]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

# These permissions belong only to trusted code from the default branch.
permissions:
  checks: read
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: merge-gate
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Require current CodeRabbit approval and enable auto-merge
        run: python3 {{FACTORY}}/automation/merge_gate.py
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOMERGE_ENABLED: ${{ vars.AUTOMERGE_ENABLED }}
