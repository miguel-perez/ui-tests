name: ui-tests check

# The self-hosted track, run on this repository's own pull requests, in two halves so pull-request code never holds a write
# token. This half checks out the pull request with a read-only token, runs nothing from it, and uploads the run summary
# (apps/web/generated/example-check.json) as an artefact. ui-tests-publish.yml runs the default
# branch's code on `workflow_run`, reads the summary as data and creates the `ui-tests` check run on the head commit.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ui-tests-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  summary:
    name: Upload the run summary
    # The publisher only reports this repository's own pull requests.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: apps/web/generated/example-check.json
          sparse-checkout-cone-mode: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-tests-check
          path: apps/web/generated/example-check.json
          if-no-files-found: error
          retention-days: 1
