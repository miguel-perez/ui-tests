name: ui-tests agent

# The agent study of this repository (apps/web/ui-tests/cli-first-run.ui.test.ts, PRD 04): a capability test, not usability.
# It runs five trials of an agent against the CLI on every push to this repository and is informational: the job never fails the
# build on a result (the run's exit code is shown, not enforced), and it is never counted with people. `push` runs only commits
# already in this repository, never code from a fork, so the key is safe to use here. Secret: ANTHROPIC_API_KEY; without it the
# job skips with a notice. The run is documented, not executed, from a clean clone without the key.
on:
  push:

permissions: {}

concurrency:
  group: ui-tests-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Skip when not configured
        id: configured
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ui-tests agent skipped: the ANTHROPIC_API_KEY secret is not set."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.configured.outputs.run == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.configured.outputs.run == 'true'
        with:
          node-version: '22.22.0'
      - if: steps.configured.outputs.run == 'true'
        run: npm ci
      - name: Run the agent study
        if: steps.configured.outputs.run == 'true'
        working-directory: apps/web
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          npx ui-tests --actor agent
          code=$?
          {
            echo "### Agent study: capability test, not usability"
            echo "Exit code $code (0 pass, 1 fail, 3 inconclusive or pending, 2 error). Informational: this job does not fail the build on a result."
            for report in .ui-tests/runs/*/report.json; do [ -f "$report" ] && echo '```json' && cat "$report" && echo '```'; done
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -eq 2 ]; then echo "::warning::ui-tests agent could not run (exit 2); see the log."; fi
          exit 0
