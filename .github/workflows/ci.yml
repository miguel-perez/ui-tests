name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Automation CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.11.0'
      - run: npm ci
      - name: Validate
        run: npm run validate
      - name: Docker image
        run: |
          docker build -t ui-tests:ci .
          docker run -d --name ui-tests-ci -p 4300:4300 ui-tests:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4300/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:4300/healthz
          curl -fsS http://127.0.0.1:4300/ui-tests.js | grep -q 'start(import.meta.url)'
      - name: Docker logs
        if: failure()
        run: docker logs ui-tests-ci || true
