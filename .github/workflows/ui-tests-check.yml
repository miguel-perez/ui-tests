name: ui-tests check

# Posts the pending ui-tests check on the pull request whose preview just deployed.
# Needs the repository secrets UI_TESTS_DATABASE_URL, VERCEL_AUTOMATION_BYPASS_SECRET and UI_TESTS_SHARE_SECRET
# (see docs/github-check.md); without UI_TESTS_DATABASE_URL it skips with a notice.
on:
  deployment_status:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ui-tests-check-${{ github.event.deployment.sha }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UI_TESTS_DATABASE_URL: ${{ secrets.UI_TESTS_DATABASE_URL }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      UI_TESTS_SHARE_SECRET: ${{ secrets.UI_TESTS_SHARE_SECRET }}
    steps:
      - name: Skip when not configured
        id: gate
        run: |
          if [ -z "$UI_TESTS_DATABASE_URL" ]; then
            echo "::notice::ui-tests check skipped: the UI_TESTS_DATABASE_URL secret is not set."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.run == 'true'
        with:
          ref: ${{ github.event.deployment.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: '22.22.0'
      - if: steps.gate.outputs.run == 'true'
        run: npm ci
      - name: Post the check
        if: steps.gate.outputs.run == 'true'
        working-directory: apps/web
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
        run: npx ui-tests check
