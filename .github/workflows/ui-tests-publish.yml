name: ui-tests check publish

# The privileged half of ui-tests.yml. `workflow_run` runs this file and the code it checks out from the default branch, never
# the pull request's: the pull request contributes only the run summary artefact, which `ui-tests check` validates as data. The
# check goes on the triggering run's head commit, always neutral, so it never blocks a merge. The sticky comment is turned off
# here so the review threads stay the review's, so the token needs no pull-request scope.
on:
  workflow_run:
    workflows: [ui-tests check]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ui-tests-check-publish-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish the ui-tests check
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.0'
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-tests-check
          path: ${{ runner.temp }}/ui-tests-check
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the check
        run: node packages/ui-tests/bin/ui-tests.mjs check "$RUNNER_TEMP/ui-tests-check/example-check.json" --no-comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
