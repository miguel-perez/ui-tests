<!-- Colours mapped onto the site's Tokyo Night tokens (canvas #1a1b26, surface #1f2335, line #292e42, ink #c0caf5, muted #a9b1d6, moment #ff9e64); see design/artefacts/README.md for the theme rules. -->
<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub PR Checks Component</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Fira+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap');
    :root {
      --bg-canvas: #1a1b26;
      --surface: #1a1b26;
      --surface-lift: #1f2335;
      --hairline: #292e42;
      --text-primary: #c0caf5;
      --text-muted: #a9b1d6;
      --moment-amber: #ff9e64;
    }
    body { margin: 0; padding: 0; background-color: var(--bg-canvas); }
    .fira-sans { font-family: 'Fira Sans', sans-serif; }
    .fira-code { font-family: 'Fira Code', monospace; }
    .hairline-border { border: 1px solid var(--hairline); }
    .hairline-bottom { border-bottom: 1px solid var(--hairline); }
  </style>
</head>
<body>
  <div class="w-[860px] h-[300px] flex items-center justify-center" data-sd-id="1">
    <div class="w-[760px] bg-[--surface] rounded-[8px] hairline-border overflow-hidden" data-sd-id="2">
      <!-- Header Row -->
      <div class="bg-[--surface-lift] px-4 py-3 hairline-bottom flex items-center justify-between" data-sd-id="3">
        <div class="flex items-center gap-3" data-sd-id="4">
          <span class="flex items-center justify-center w-5 h-5 rounded-full bg-[--text-primary] text-[--bg-canvas]" data-sd-id="5">
            <iconify-icon icon="lucide:check" class="text-[14px] font-bold"></iconify-icon>
          </span>
          <h3 class="fira-sans text-[15px] font-medium text-[--text-primary]" data-sd-id="6">All checks have passed</h3>
        </div>
        <span class="fira-code text-[11px] text-[--text-muted]" data-sd-id="7">Example run</span>
      </div>

      <!-- Check Rows -->
      <div class="flex flex-col" data-sd-id="8">
        <!-- Row 1: ui-tests (The Amber Moment) -->
        <div class="px-4 py-3 flex items-center justify-between hairline-bottom" data-sd-id="9">
          <div class="flex items-center gap-3" data-sd-id="10">
            <iconify-icon icon="lucide:alert-circle" class="text-[18px] text-[--moment-amber]"></iconify-icon>
            <div class="flex items-baseline gap-2" data-sd-id="11">
              <span class="fira-sans text-[14px] font-medium text-[--text-primary]" data-sd-id="12">ui-tests</span>
              <span class="fira-sans text-[14px] text-[--moment-amber]" data-sd-id="13">· Problems found: 4 across 5 people</span>
            </div>
          </div>
          <a href="#" id="check-details-1" class="fira-sans text-[12px] text-[--text-muted] hover:text-[--text-primary] transition-colors" data-sd-id="14">Details</a>
        </div>

        <!-- Row 2: preview -->
        <div class="px-4 py-3 flex items-center justify-between hairline-bottom" data-sd-id="15">
          <div class="flex items-center gap-3" data-sd-id="16">
            <iconify-icon icon="lucide:check-circle-2" class="text-[18px] text-[--text-primary]"></iconify-icon>
            <div class="flex items-baseline gap-2" data-sd-id="17">
              <span class="fira-sans text-[14px] font-medium text-[--text-primary]" data-sd-id="18">preview</span>
              <span class="fira-sans text-[14px] text-[--text-muted]" data-sd-id="19">· Deployment ready</span>
            </div>
          </div>
          <a href="#" id="check-details-2" class="fira-sans text-[12px] text-[--text-muted] hover:text-[--text-primary] transition-colors" data-sd-id="20">Details</a>
        </div>

        <!-- Row 3: tests -->
        <div class="px-4 py-3 flex items-center justify-between" data-sd-id="21">
          <div class="flex items-center gap-3" data-sd-id="22">
            <iconify-icon icon="lucide:check-circle-2" class="text-[18px] text-[--text-primary]"></iconify-icon>
            <div class="flex items-baseline gap-2" data-sd-id="23">
              <span class="fira-sans text-[14px] font-medium text-[--text-primary]" data-sd-id="24">tests</span>
              <span class="fira-sans text-[14px] text-[--text-muted]" data-sd-id="25">· 212 passed</span>
            </div>
          </div>
          <a href="#" id="check-details-3" class="fira-sans text-[12px] text-[--text-muted] hover:text-[--text-primary] transition-colors" data-sd-id="26">Details</a>
        </div>
      </div>
    </div>
  </div>

</body></html>
